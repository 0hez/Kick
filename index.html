<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KickDeck</title>
<style>
:root{--bg:#050607;--panel:#151719;--line:#292d30;--tx:#f4f5f6;--mut:#9ba1a6;--g:#53fc18;--r:12px;--pad:10px;--h:44px;--chat-crop:132px;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none;margin:0;background:var(--bg);color:var(--tx);font:14px/1.35 system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}
body{position:fixed;top:var(--app-top,0px);left:0;right:0;height:var(--app-vh,100dvh);display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 0;min-width:0;min-height:0}
input,button,select,textarea{font:inherit;color:var(--tx);background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:0 12px;min-width:0;height:var(--h)}
textarea{height:auto;padding:8px}
#msg,#ch,dialog input,dialog textarea{font-size:16px}
input:focus,button:focus-visible,select:focus-visible{outline:2px solid var(--g);outline-offset:1px}
button{cursor:pointer;touch-action:manipulation;white-space:nowrap}
button:disabled{opacity:.45;cursor:default}
button.pri{background:var(--g);color:#06140a;border-color:var(--g);font-weight:750}

/* header: one tidy grid row */
header{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto auto;align-items:center;gap:8px;padding:8px var(--pad);border-bottom:1px solid var(--line);background:#090b0c;z-index:2}
header b{color:var(--g);font-size:16px;white-space:nowrap}
#ch{width:100%}
#login{max-width:104px;overflow:hidden;text-overflow:ellipsis}
#cfg{width:var(--h);padding:0}

/* player: true 16:9, full width */
#stage{width:100%;aspect-ratio:16/9;max-height:calc(var(--app-vh,100dvh)*.3);flex:0 0 auto;background:#000;display:grid;place-items:center;color:var(--mut);overflow:hidden;text-align:center;padding:0 12px}
#stage iframe{width:100%;height:100%;border:0;display:block}

/* chat */
#chat{position:relative;flex:1 1 0;min-height:0;min-width:0;background:#000;overflow:hidden;border-top:1px solid var(--line)}
#chat iframe{position:absolute;top:0;left:0;width:100%;height:calc(100% + var(--chat-crop));border:0;display:block}

/* footer: consistent 10px gutters, 8px rhythm */
footer{position:relative;flex:0 0 auto;width:100%;min-width:0;border-top:1px solid var(--line);padding:8px var(--pad) calc(8px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;background:#080a0b;z-index:20}
#st{color:var(--mut);font-size:12px;line-height:1.2;max-height:16px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#st:empty{display:none}
#emo{display:none;gap:6px;overflow-x:auto;scrollbar-width:none}#emo.open{display:flex}#emo button{height:38px;padding:0 10px}

/* horizontal scrollers run edge to edge but start aligned with the gutter */
#macros,#emoteQuick{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 calc(var(--pad)*-1);padding:0 var(--pad);scroll-padding:0 var(--pad);-webkit-overflow-scrolling:touch}
#macros::-webkit-scrollbar,#emoteQuick::-webkit-scrollbar{display:none}
#macros:empty{display:none}
#macros button{flex:0 0 auto;height:36px;padding:0 12px;font-size:13px;border-radius:10px;background:#171a1c}
#emoteQuick button{flex:0 0 auto;min-width:46px;height:46px;padding:0 6px;font-size:12px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:#171a1c}
#emoteQuick img{height:34px;width:auto;max-width:72px;min-width:28px;object-fit:contain;display:block;pointer-events:none;-webkit-user-drag:none}
#emoteQuick .emote-fallback{font-weight:650;padding:0 4px}
#emoteQuick button.noid{border-style:dashed;border-color:#4a4f54}
#emoteQuick button:active{transform:scale(.94);border-color:var(--g)}

/* repeat bar: one row, no sideways scrolling */
#repeatbar{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:8px;align-items:center}
#repeatbar select,#repeatbar button{height:38px;font-size:13px;padding:0 10px;border-radius:10px}
#repeatStart{background:#1b2b19;border-color:#365b32;color:#c6ffb1;font-variant-numeric:tabular-nums}
#repeatStop{background:#321919;border-color:#633333;color:#ffb2b2}

/* composer */
.row{display:flex;gap:8px;align-items:center;min-width:0}
#composer{display:grid;grid-template-columns:var(--h) minmax(0,1fr) var(--h) auto;gap:8px;align-items:center}
#composer .ib{width:var(--h);padding:0;font-size:18px}
#msg{width:100%;border-radius:14px}
#send{padding:0 18px}

dialog{background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:14px;width:min(440px,94vw);max-height:85dvh;overflow:auto}dialog::backdrop{background:#000a}dialog label{display:grid;gap:4px;margin:10px 0;color:var(--mut);font-size:13px}dialog input,dialog select{color:var(--tx)}dialog p{color:var(--mut);font-size:13px;margin:6px 0}

@media(max-width:859px){
 html.kb #stage,html.kb #emoteQuick,html.kb #macros,html.kb #repeatbar,html.kb #st{display:none}
 html.kb footer{padding-bottom:8px}
}
@media(max-width:520px){header b{display:none}header{grid-template-columns:minmax(0,1fr) auto auto auto}}
@media(min-width:860px){
 body{display:grid;grid-template-columns:minmax(0,1fr) 390px;grid-template-rows:auto minmax(0,1fr) auto}
 header{grid-column:1/3}
 #stage{grid-column:1;grid-row:2/4;height:100%;max-height:none;aspect-ratio:auto}
 #chat{grid-column:2;grid-row:2}
 footer{grid-column:2;grid-row:3}
}
</style>
</head>
<body>
<header>
 <b>KickDeck</b>
 <input id="ch" placeholder="channel name" autocapitalize="none" autocomplete="off">
 <button id="go" class="pri">Watch</button>
 <button id="login" class="pri">Log in</button>
 <button id="cfg" aria-label="Settings">⚙</button>
</header>
<div id="stage">Enter a channel to start watching</div>
<div id="chat" aria-live="polite"></div>
<footer>
 <div id="st" class="sys" aria-live="polite"></div>
 <div id="emo"></div>
 <div id="macros"></div>
 <div id="emoteQuick" aria-label="Quick-send Kick emotes"></div>
 <div id="repeatbar" aria-label="Repeat message controls">
  <select id="repeatDuration" aria-label="Repeat duration"><option value="60">1 min</option><option value="300">5 min</option><option value="600">10 min</option></select>
  <select id="repeatInterval" aria-label="Repeat interval"><option value="1">Every 1s</option><option value="2">Every 2s</option><option value="3">Every 3s</option><option value="5" selected>Every 5s</option><option value="10">Every 10s</option><option value="15">Every 15s</option><option value="30">Every 30s</option><option value="60">Every 1m</option></select>
  <button id="repeatStart" type="button">Start repeat</button>
  <button id="repeatStop" type="button" disabled>Stop</button>
 </div>
 <div id="composer">
  <button id="idbtn" class="ib" aria-label="Chat identity">🛡</button>
  <input id="msg" placeholder="Send a message" maxlength="500" autocomplete="off" enterkeyhint="send">
  <button id="emobtn" class="ib" aria-label="Emoji">😀</button>
  <button id="send" class="pri">Send</button>
 </div>
</footer>

<dialog id="dlg">
 <h3 style="margin:0">Settings</h3>
 <p id="acct">Not logged in.</p>
 <div class="row"><button id="logout">Log out</button></div>
 <label>Broadcaster user ID (auto-filled if lookup works)
  <input id="bid" inputmode="numeric" placeholder="e.g. 123456">
 </label>
 <label>Chatroom ID (auto-filled if lookup works)
  <input id="rid" inputmode="numeric" placeholder="e.g. 654321">
 </label>
 <label>Your message colors
  <select id="colmode">
   <option value="rand">New random color every message</option>
   <option value="fixed">One fixed color</option>
  </select>
 </label>
 <label>Highlight words (comma separated)
  <input id="hl" placeholder="your name, giveaway">
 </label>
 <label>Hide messages containing (comma separated)
  <input id="mute" placeholder="word1, word2">
 </label>
 <label>Chat text size
  <input id="fs" type="range" min="12" max="22" value="15">
 </label>
 <label>Quick-send emotes (one per line: NAME, or NAME:KickEmoteID, or NAME:imageURL)
  <textarea id="qe" rows="5" placeholder="KEKW:37226&#10;LUL&#10;PogU" style="color:var(--tx);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;font:inherit"></textarea>
 </label>
 <label>Quick-send phrases (one per line)
  <textarea id="mac" rows="4" style="color:var(--tx);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;font:inherit"></textarea>
 </label>
 <div class="row" style="justify-content:flex-end">
  <button id="close" class="pri">Save</button>
 </div>
</dialog>

<dialog id="idlg">
 <h3 style="margin:0">Chat identity</h3>
 <p id="iname"></p>
 <div id="sw" style="display:flex;flex-wrap:wrap;gap:10px;margin:10px 0"></div>
 <div class="row"><button id="rnd">New random color every message</button></div>
 <p>These colors show on your own composer line. Kick decides the color everyone sees in chat and only lets you change it on kick.com.</p>
 <div class="row" style="justify-content:space-between;align-items:center"><a id="kk" target="_blank" rel="noopener" style="color:var(--g)">Open Kick identity</a><button id="iclose" class="pri">Done</button></div>
</dialog>

<script>
let vpBase=0,vpRaf=0;
const syncViewport=()=>{
 cancelAnimationFrame(vpRaf);
 vpRaf=requestAnimationFrame(()=>{
  const vv=window.visualViewport,root=document.documentElement;
  const h=Math.round(vv?vv.height:window.innerHeight);
  const top=Math.round(vv?vv.offsetTop:0);
  const typing=/^(INPUT|TEXTAREA)$/.test((document.activeElement||{}).tagName||'');
  vpBase=typing?Math.max(vpBase,h):h;
  const kb=typing&&vpBase-h>120;
  root.classList.toggle('kb',kb);
  root.style.setProperty('--app-vh',h+'px');
  root.style.setProperty('--app-top',top+'px');
  if(window.scrollY||window.scrollX)window.scrollTo(0,0);
 });
};
syncViewport();
window.addEventListener('resize',syncViewport,{passive:true});
window.addEventListener('orientationchange',()=>{vpBase=0;setTimeout(syncViewport,300)});
window.addEventListener('scroll',syncViewport,{passive:true});
if(window.visualViewport){visualViewport.addEventListener('resize',syncViewport,{passive:true});visualViewport.addEventListener('scroll',syncViewport,{passive:true})}
document.addEventListener('focusin',()=>{syncViewport();setTimeout(syncViewport,150);setTimeout(syncViewport,400)});
document.addEventListener('focusout',()=>{setTimeout(syncViewport,50);setTimeout(syncViewport,350)});

const $=s=>document.querySelector(s);
['#send','#emobtn','#idbtn'].forEach(id=>{const el=document.querySelector(id);if(el)el.addEventListener('mousedown',e=>e.preventDefault())});
const S=(()=>{try{return JSON.parse(localStorage.getItem('kd')||'{}')}catch(e){return{}}})();
const save=()=>{try{localStorage.setItem('kd',JSON.stringify(S))}catch(e){}};
const csv=v=>(v||'').split(',').map(x=>x.trim().toLowerCase()).filter(Boolean);
let ws,channel,lastSend=0,pinned=true;

const chat=$('#chat');
function sys(t){const e=$('#st');e.style.color='';e.textContent=t}
function clearSt(){$('#st').textContent=''}
function line(name,color,text){const e=$('#st');e.textContent='';const u=document.createElement('b');u.style.color=color;u.textContent=name;e.append(u,': '+text)}
const randColor=()=>`hsl(${Math.floor(Math.random()*360)} 85% 65%)`;

// Player
function watch(name){
 channel=name.trim().toLowerCase();if(!channel)return;
 if(typeof stopRepeat==='function')stopRepeat();
 $('#stage').innerHTML='';
 const f=document.createElement('iframe');
 f.src='https://player.kick.com/'+encodeURIComponent(channel);
 f.allow='autoplay; fullscreen; picture-in-picture';f.allowFullscreen=true;
 $('#stage').append(f);
 S.channel=channel;save();
 renderQuickEmotes();
 connect().then(loadEmoteImages);
}

// Chat: Kick's own chat page, so it keeps working when Kick changes its backend
async function connect(){
 chat.innerHTML='';
 const f=document.createElement('iframe');
 f.src='https://kick.com/popout/'+encodeURIComponent(channel)+'/chat';
 chat.append(f);
 try{
  const r=await fetch('/api/channel?slug='+encodeURIComponent(channel));
  const j=await r.json();
  if(j.bid){S.bid=String(j.bid);save()}
 }catch(e){}
}

// Send. Repeating sends wait for the local cooldown and respect server 429 Retry-After.
const delay=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function send(text, options={}){
 text=(text||'').trim();if(!text)return false;
 if(!user){if(!options.silent)sys('Log in to send messages.');return false}
 if(!S.bid){if(!options.silent)sys('Could not find this channel yet.');return false}
 while(true){
  if(options.repeat&&!repeatActive)return false;
  const wait=1500-(Date.now()-lastSend);
  if(wait>0){
   if(!options.repeat){if(!options.silent)sys('Please wait for the send cooldown.');return false}
   await delay(Math.min(wait,200));continue;
  }
  lastSend=Date.now();
  try{
   const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({broadcaster_user_id:Number(S.bid),content:text})});
   if(r.status===429&&options.repeat){
    const h=Number(r.headers.get('Retry-After'));
    const retryMs=Number.isFinite(h)&&h>0?h*1000:2000;
    await delay(retryMs);continue;
   }
   if(r.status===401){user=null;showUser();if(!options.silent)sys('Session expired. Log in again.');return false}
   if(!r.ok){if(!options.silent)sys('Send failed ('+r.status+').');return false}
   if(S.colmode==='fixed'){S.col=S.col||randColor();save()}
   const col=S.colmode==='fixed'?S.col:randColor();
   if(!options.repeat){line(user.name,col,text);$('#msg').value='';$('#msg').focus({preventScroll:true})}
   return true;
  }catch(e){if(!options.silent)sys('Send blocked by the browser or network. Try again or check your token.');return false}
 }
}

// Repeat sender: sends immediately, then repeats at the selected interval.
let repeatTimer=null,repeatEnd=0,repeatNext=0,repeatActive=false,repeatBusy=false;
function stopRepeat(){
 repeatActive=false;repeatBusy=false;if(repeatTimer){clearInterval(repeatTimer);repeatTimer=null}
 $('#repeatStart').disabled=false;$('#repeatStart').textContent='Start repeat';$('#repeatStop').disabled=true;
}
function startRepeat(){
 const message=$('#msg').value.trim();
 if(!message){sys('Enter a message first.');return}
 if(!user){sys('Log in to send messages.');return}
 if(!S.bid){sys('Choose a channel and wait for its chat details to load.');return}
 stopRepeat();repeatActive=true;
 const duration=Number($('#repeatDuration').value)||60;
 const interval=Math.max(1,Number($('#repeatInterval').value)||5);
 repeatEnd=Date.now()+duration*1000;repeatNext=Date.now();
 $('#repeatStart').disabled=true;$('#repeatStop').disabled=false;
 const tick=async()=>{
  if(!repeatActive)return;
  const now=Date.now();
  if(now>=repeatEnd){stopRepeat();return}
  if(now>=repeatNext&&!repeatBusy){
   repeatBusy=true;
   const ok=await send(message,{repeat:true,silent:true});
   repeatBusy=false;
   if(!ok){stopRepeat();sys('Repeat stopped because the message could not be sent.');return}
   repeatNext=Date.now()+interval*1000;
  }
  const left=Math.max(0,Math.ceil((Math.min(repeatNext,repeatEnd)-Date.now())/1000));
  $('#repeatStart').textContent='Repeating '+left+'s';
 };
 repeatTimer=setInterval(tick,250);tick();
}
$('#repeatStart').addEventListener('click',startRepeat);
$('#repeatStop').addEventListener('click',stopRepeat);

// UI wiring
$('#go').onclick=()=>watch($('#ch').value);
$('#ch').onkeydown=e=>{if(e.key==='Enter')watch($('#ch').value)};
$('#send').onclick=()=>send($('#msg').value);
$('#msg').onkeydown=e=>{if(e.key==='Enter')send($('#msg').value)};
$('#cfg').onclick=()=>{
 $('#bid').value=S.bid||'';$('#rid').value=S.rid||'';
 $('#colmode').value=S.colmode||'rand';$('#hl').value=S.hl||'';$('#mute').value=S.mute||'';
 $('#qe').value=(S.qe&&S.qe.length?S.qe:DEFAULT_EMOTES).join('\n');$('#fs').value=S.fs||15;$('#mac').value=(S.mac||['gg','LUL','W stream']).join('\n');
 $('#dlg').showModal();
};
$('#close').onclick=()=>{
 S.bid=$('#bid').value.trim();
 const nr=$('#rid').value.trim();const ridChanged=nr&&nr!==S.rid;S.rid=nr;
 S.colmode=$('#colmode').value;S.hl=$('#hl').value;S.mute=$('#mute').value;
 S.fs=$('#fs').value;S.qe=$('#qe').value.split('\n').map(x=>x.trim()).filter(Boolean).slice(0,24);S.mac=$('#mac').value.split('\n').map(x=>x.trim()).filter(Boolean).slice(0,12);
 save();applyPrefs();$('#dlg').close();loadEmoteImages();
 
};
function applyPrefs(){
 chat.style.fontSize=(S.fs||15)+'px';
 const box=$('#macros');box.innerHTML='';
 (S.mac||['gg','LUL','W stream']).forEach(t=>{
  const b=document.createElement('button');b.textContent=t;b.onclick=()=>send(t);box.append(b);
 });
 }
// Quick-send emotes. Image sources, in priority order:
//  1) your own NAME:KickEmoteID / NAME:URL lines in Settings
//  2) Kick channel + global emotes (if Kick lets the browser/your server fetch them)
//  3) 7TV channel set (looked up by Kick user id), 7TV global set
//  4) 7TV exact-name search (cached) for anything still missing
// Animated WebP/GIF play directly inside the <img>.
const DEFAULT_EMOTES=['KEKW','LUL','PogU','PepeLaugh','Sadge','GIGACHAD','catJAM','Kappa'];
const emoteImages=new Map(); // name -> {url, kick}
const kickUrl=id=>`https://files.kick.com/emotes/${id}/fullsize`;
const sevenUrl=id=>`https://cdn.7tv.app/emote/${id}/2x.webp`;
function qeEntries(){
 return (S.qe&&S.qe.length?S.qe:DEFAULT_EMOTES).map(l=>{
  const i=l.indexOf(':');if(i<1)return{name:l.trim()};
  const name=l.slice(0,i).trim(),v=l.slice(i+1).trim();
  if(/^\d+$/.test(v))return{name,url:kickUrl(v),kick:v};
  if(/^https?:/.test(v))return{name,url:v};
  return{name};
 }).filter(e=>e.name);
}
const emoteNames=()=>qeEntries().map(e=>e.name);
function putEmote(name,url,kick){if(name&&url&&!emoteImages.has(name))emoteImages.set(name,{url,kick:kick||null})}
function seedEmotes(){
 emoteImages.clear();
 qeEntries().forEach(e=>e.url&&putEmote(e.name,e.url,e.kick));
 const c=S.ec||{};for(const n in c)putEmote(n,c[n]);
}
function addKickEmotes(data){
 if(!data)return;
 const groups=[];
 if(Array.isArray(data))groups.push(...data.map(g=>g&&g.emotes));
 groups.push(data.emotes,data.data?.emotes,data.data?.channel,data.data?.global,data.channel,data.global,data.emoji);
 for(const arr of groups){if(!Array.isArray(arr))continue;for(const e of arr){
  const name=e&&(e.name||e.code);const id=e&&e.id;
  if(name&&id)putEmote(name,kickUrl(id),String(id));
  else if(name&&e.image_url)putEmote(name,e.image_url);
 }}
}
function addSeven(list){for(const e of (list||[])){if(e&&e.name&&e.id)putEmote(e.name,sevenUrl(e.id))}}
const getJSON=async u=>{try{const r=await fetch(u,{credentials:'omit'});if(!r.ok)return null;return await r.json()}catch(e){return null}};
async function search7tv(name){
 try{
  const r=await fetch('https://7tv.io/v3/gql',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:'query($q:String!){emotes(query:$q,page:1,limit:20,filter:{exact_match:true,case_sensitive:true}){items{id name}}}',variables:{q:name}})});
  const j=await r.json();const it=(j&&j.data&&j.data.emotes&&j.data.emotes.items)||[];
  const m=it.find(x=>x.name===name);return m?sevenUrl(m.id):null;
 }catch(e){return null}
}
async function loadEmoteImages(){
 seedEmotes();renderQuickEmotes();
 const slug=encodeURIComponent(channel||'');
 const [mine,kick,sevenCh,sevenGl]=await Promise.all([
  channel?getJSON('/api/emotes?slug='+slug):null,
  channel?getJSON('https://kick.com/emotes/'+slug):null,
  S.bid?getJSON('https://7tv.io/v3/users/kick/'+encodeURIComponent(S.bid)):null,
  getJSON('https://7tv.io/v3/emote-sets/global')
 ]);
 addKickEmotes(mine);addKickEmotes(kick);
 addSeven(sevenCh&&sevenCh.emote_set&&sevenCh.emote_set.emotes);
 addSeven(sevenGl&&sevenGl.emotes);
 renderQuickEmotes();
 const missing=emoteNames().filter(n=>!emoteImages.has(n));
 if(missing.length){
  const found=await Promise.all(missing.map(search7tv));
  S.ec=S.ec||{};
  missing.forEach((n,i)=>{if(found[i]){putEmote(n,found[i]);S.ec[n]=found[i]}});
  save();renderQuickEmotes();
 }
}
function parseKickId(v){const m=String(v).match(/emote:(\d+)/)||String(v).match(/emotes\/(\d+)/)||String(v).match(/^\s*(\d+)\s*$/);return m?m[1]:null}
function setKickId(name,id){
 const lines=(S.qe&&S.qe.length?S.qe:DEFAULT_EMOTES).slice();
 const i=lines.findIndex(l=>l.split(':')[0].trim()===name);
 if(i>=0)lines[i]=name+':'+id;else lines.push(name+':'+id);
 S.qe=lines;save();
 emoteImages.set(name,{url:kickUrl(id),kick:id});
}
function renderQuickEmotes(){
 const box=$('#emoteQuick');if(!box)return;box.innerHTML='';
 const names=emoteNames();
 const recent=(S.recentEmotes||[]).filter(n=>names.includes(n)||emoteImages.has(n));
 const list=[...recent,...names.filter(x=>!recent.includes(x))];
 list.forEach(code=>{
  const b=document.createElement('button');b.type='button';b.title='Send '+code;b.setAttribute('aria-label','Send '+code);
  const em=emoteImages.get(code);
  const fallback=()=>{const t=document.createElement('span');t.className='emote-fallback';t.textContent=code;b.append(t)};
  if(em){const img=document.createElement('img');img.alt=code;img.decoding='async';img.draggable=false;img.onerror=()=>{img.remove();fallback()};img.src=em.url;b.append(img)}
  else fallback();
  if(!(em&&em.kick))b.classList.add('noid');
  b.onclick=async()=>{
   let kid=(emoteImages.get(code)||{}).kick;
   if(!kid){
    // Kick only turns text into an emote when it is sent as [emote:ID:NAME]
    const v=prompt('To send '+code+' as a real Kick emote, paste its Kick emote ID (the number in files.kick.com/emotes/ID/...). Cancel to do nothing.');
    if(v===null)return;
    kid=parseKickId(v);
    if(!kid){sys('Could not find an emote ID in that.');return}
    setKickId(code,kid);
   }
   const ok=await send(`[emote:${kid}:${code}]`);
   if(ok){const r=S.recentEmotes||[];S.recentEmotes=[code,...r.filter(x=>x!==code)].slice(0,12);save();renderQuickEmotes()}
   else renderQuickEmotes();
  };
  box.append(b);
 });
}
let user=null;
function showUser(){$('#login').textContent=user?user.name:'Log in';$('#login').className=user?'':'pri';$('#acct').textContent=user?'Logged in as '+user.name:'Not logged in.'}
$('#login').onclick=()=>{if(!user)location.href='/auth/login'};
$('#logout').onclick=()=>{stopRepeat();location.href='/auth/logout'};
fetch('/api/me').then(r=>r.ok?r.json():null).then(j=>{user=j;showUser()}).catch(()=>{});
const COLS=['#ff6b6b','#ffa94d','#ffe066','#69db7c','#38d9a9','#4dabf7','#9775fa','#f783ac','#e8eeee'];
$('#idbtn').onclick=()=>{
 $('#iname').textContent=user?'Logged in as '+user.name:'Not logged in';
 $('#kk').href='https://kick.com/'+(channel||'');
 const sw=$('#sw');sw.innerHTML='';
 COLS.forEach(c=>{const b=document.createElement('button');b.style.cssText='width:38px;height:38px;padding:0;border-radius:50%;background:'+c;b.setAttribute('aria-label','Color '+c);b.onclick=()=>{S.colmode='fixed';S.col=c;save();line(user?user.name:'you',c,'color set')};sw.append(b)});
 $('#idlg').showModal();
};
$('#rnd').onclick=()=>{S.colmode='rand';save();sys('Random color every message')};
$('#iclose').onclick=()=>$('#idlg').close();
['😂','🔥','💀','❤️','👏','😭','🙏','👀','🫡','💯'].forEach(e=>{const b=document.createElement('button');b.textContent=e;b.style.padding='4px 9px';b.onclick=()=>{$('#msg').value+=e;$('#msg').focus({preventScroll:true})};$('#emo').append(b)});
$('#emobtn').onclick=()=>$('#emo').classList.toggle('open');

applyPrefs();
renderQuickEmotes();
if(S.channel){$('#ch').value=S.channel;watch(S.channel)}
</script>
